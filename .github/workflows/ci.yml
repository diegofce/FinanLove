name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: finanlove
          POSTGRES_PASSWORD: finanlove
          POSTGRES_DB: finanlove_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U finanlove -d finanlove_test"
          --health-interval=5s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          cd src/backend
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Wait for PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          until pg_isready -h 127.0.0.1 -p 5432 -U finanlove -d finanlove_test; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done
      - name: Upgrade database
        env:
          DATABASE_URL: postgresql+asyncpg://finanlove:finanlove@localhost:5432/finanlove_test
          TEST_DATABASE_URL: postgresql+asyncpg://finanlove:finanlove@localhost:5432/finanlove_test
        run: |
          cd src/backend
          alembic upgrade head
      - name: Lint with Ruff
        run: |
          cd src/backend
          ruff check .
      - name: Type check with MyPy
        run: |
          cd src/backend
          mypy .
      - name: Run PostgreSQL integration tests
        env:
          DATABASE_URL: postgresql+asyncpg://finanlove:finanlove@localhost:5432/finanlove_test
          TEST_DATABASE_URL: postgresql+asyncpg://finanlove:finanlove@localhost:5432/finanlove_test
          CI: "true"
        run: |
          cd src/backend
          pytest tests/integration -q -ra
      - name: Run unit and HTTP tests with coverage
        env:
          DATABASE_URL: postgresql+asyncpg://finanlove:finanlove@localhost:5432/finanlove_test
          TEST_DATABASE_URL: postgresql+asyncpg://finanlove:finanlove@localhost:5432/finanlove_test
          CI: "true"
        run: |
          cd src/backend
          pytest tests/unit tests/e2e tests/integration --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=60

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v3
        with:
          node-version: "20"
      - name: Install dependencies
        run: |
          cd src/frontend
          npm ci
      - name: Lint
        run: |
          cd src/frontend
          npm run lint
      - name: Type check
        run: |
          cd src/frontend
          npm run typecheck
      - name: Run Tests
        run: |
          cd src/frontend
          npm test
      - name: Build
        run: |
          cd src/frontend
          npm run build
